map $http_x_forwarded_proto $fastcgi_https {
    default $https;
    https on;
}

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    client_max_body_size 25M;
    client_body_buffer_size 512k;
    client_body_temp_path /var/lib/nginx/tmp/client_body 1 2;
    fastcgi_temp_path /var/lib/nginx/tmp/fastcgi 1 2;

    # Allow following symlinks (needed for public/storage -> storage/app/public)
    disable_symlinks off;

    index index.php;

    charset utf-8;

    # Gzip compression for faster asset delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Cache Vite build assets (strictly hashed files in /build/)
    location /build/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Public storage assets (symlink public/storage -> storage/app/public)
    location ^~ /storage/ {
        disable_symlinks off;
        try_files $uri /index.php?$query_string;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Static assets with fallback to Laravel router (for dynamic Livewire/framework routes)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        try_files $uri /index.php?$query_string;
        expires 7d;
        access_log off;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 8 128k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;

        # Forward HTTPS status when behind Traefik SSL termination
        fastcgi_param HTTPS $fastcgi_https if_not_empty;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
